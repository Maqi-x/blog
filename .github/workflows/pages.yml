  name: Deploy site

  on:
    push:
      branches:
        - main
    workflow_dispatch:

  permissions:
    contents: read
    pages: write
    id-token: write

  jobs:
    deploy:
      runs-on: ubuntu-latest

      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}

      steps:
        - uses: actions/checkout@v6
          with:
            submodules: recursive

        - uses: actions/configure-pages@v5

        - name: Build site
          run: make dist

        - uses: actions/upload-pages-artifact@v4
          with:
            path: out/dist

        - name: Deploy
          id: deployment
          uses: actions/deploy-pages@v4

